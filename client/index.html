    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="StellarLLM - Tu IA personal, siempre disponible" />
    <title>StellarLLM</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      html,body{height:100%;background:#080808;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      #loading-container{position:fixed;inset:0;background:#080808;z-index:9999;transition:opacity .7s ease}
      #loading-container.fade-out{opacity:0;pointer-events:none}
      #neural-canvas{position:absolute;inset:0;width:100%;height:100%}
      #splash-ui{
        position:absolute;inset:0;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        animation:uiFadeIn 1.1s ease .5s both;
      }
      @keyframes uiFadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      #splash-card{
        display:flex;flex-direction:column;align-items:center;gap:20px;
        padding:40px 52px 36px;
        background:rgba(255,255,255,.03);
        border:1px solid rgba(255,255,255,.08);
        border-radius:28px;
        backdrop-filter:blur(16px);
        box-shadow:0 0 100px rgba(0,0,0,.8),0 0 60px rgba(100,160,255,.04);
      }
      #splash-logo{
        width:80px;height:80px;
        filter:drop-shadow(0 0 20px rgba(255,255,255,.4));
        animation:logoPulse 2.8s ease-in-out infinite;
      }
      @keyframes logoPulse{
        0%,100%{filter:drop-shadow(0 0 18px rgba(255,255,255,.3));transform:scale(1)}
        50%{filter:drop-shadow(0 0 46px rgba(160,200,255,.8));transform:scale(1.07)}
      }
      #splash-title{
        font-size:22px;font-weight:300;letter-spacing:8px;
        color:#fff;text-transform:uppercase;
        text-shadow:0 0 28px rgba(180,210,255,.28);
      }
      #splash-dots{display:flex;gap:7px;margin-top:4px}
      #splash-dots span{
        width:5px;height:5px;border-radius:50%;
        background:rgba(255,255,255,.4);
        animation:dot 1.5s ease-in-out infinite;
      }
      #splash-dots span:nth-child(2){animation-delay:.25s}
      #splash-dots span:nth-child(3){animation-delay:.5s}
      @keyframes dot{
        0%,80%,100%{transform:scale(1);opacity:.3}
        40%{transform:scale(1.7);opacity:1}
      }
    </style>
    <script>
      (function(){
        var t=localStorage.getItem('color-theme');
        document.documentElement.style.background=(t==='light')?'#ffffff':'#080808';
      })();
    </script>
    <script defer type="module" src="/src/main.jsx"></script>

    <script>
(function(){
  var C=document.getElementById('neural-canvas'),ctx=C.getContext('2d');
  var COLS=7,ROWS=6,DRIFT=26,NODE_R=4.5,HALO_R=32,LINE_A=0.10,PULSE_INT=145,WAVE_INT=4800;
  var W,H,nodes,edges,pulses,rings,last=0,pT=0,rT=0;

  function resize(){
    W=C.width=window.innerWidth;
    H=C.height=window.innerHeight;
    init();
  }

  function init(){
    var px=W*.09,py=H*.09,sx=(W-px*2)/(COLS-1),sy=(H-py*2)/(ROWS-1);
    nodes=[];
    for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
      var ox=px+c*sx,oy=py+r*sy;
      nodes.push({ox:ox,oy:oy,x:ox,y:oy,
        ph:Math.random()*Math.PI*2, ph2:Math.random()*Math.PI*2,
        gph:Math.random()*Math.PI*2,
        sp:.00033+Math.random()*.00022,
        gsp:.0008+Math.random()*.0006,
        dr:DRIFT*.65+Math.random()*DRIFT*.7});
    }
    edges=[];
    var I=function(r,c){return r*COLS+c;};
    for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
      if(c+1<COLS)            edges.push({a:I(r,c),b:I(r,c+1)});
      if(r+1<ROWS)            edges.push({a:I(r,c),b:I(r+1,c)});
      if(r+1<ROWS&&c+1<COLS)  edges.push({a:I(r,c),b:I(r+1,c+1)});
      if(r+1<ROWS&&c>0)       edges.push({a:I(r,c),b:I(r+1,c-1)});
    }
    pulses=[];rings=[];
    for(var i=0;i<16;i++) spawnP(Math.random()*5000);
  }

  function spawnP(off){
    var e=edges[Math.floor(Math.random()*edges.length)];
    pulses.push({a:e.a,b:e.b,
      t:off ? -(off*.0021) : 0,
      spd:.0018+Math.random()*.0018,
      w:2.2+Math.random()*2.4,
      al:.48+Math.random()*.42});
  }

  function spawnR(x,y){
    rings.push({x:x,y:y,r:0,al:.28,spd:.00046});
  }

  function frame(ts){
    var dt=ts-last; last=ts; if(dt>120) dt=16;

    for(var i=0;i<nodes.length;i++){
      var n=nodes[i];
      n.ph+=n.sp*dt; n.ph2+=n.sp*dt*1.37; n.gph+=n.gsp*dt;
      n.x=n.ox+Math.cos(n.ph)*n.dr;
      n.y=n.oy+Math.sin(n.ph2)*n.dr*.68;
    }

    pT+=dt;
    if(pT>=PULSE_INT){
      pT=0; spawnP(); spawnP();
      if(Math.random()<.38) spawnP();
    }

    rT+=dt;
    if(rT>WAVE_INT+Math.random()*3500){
      rT=0;
      var rn=nodes[Math.floor(Math.random()*nodes.length)];
      spawnR(rn.x,rn.y);
    }

    pulses=pulses.filter(function(p){p.t+=p.spd*dt/1000*60;return p.t<1;});
    rings=rings.filter(function(r){
      r.r+=r.spd*dt*Math.max(W,H); r.al-=.000065*dt; return r.al>0;
    });

    /* â”€â”€ draw â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#080808'; ctx.fillRect(0,0,W,H);

    /* vignette */
    var vig=ctx.createRadialGradient(W/2,H/2,H*.12,W/2,H/2,H*.92);
    vig.addColorStop(0,'rgba(0,0,0,0)');
    vig.addColorStop(1,'rgba(0,0,0,.62)');
    ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

    /* rings */
    for(var i=0;i<rings.length;i++){
      var rg=rings[i];
      ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,Math.PI*2);
      ctx.strokeStyle='rgba(160,200,255,'+rg.al.toFixed(3)+')';
      ctx.lineWidth=1.3; ctx.stroke();
    }

    /* base edges */
    for(var i=0;i<edges.length;i++){
      var e=edges[i],na=nodes[e.a],nb=nodes[e.b];
      ctx.beginPath(); ctx.moveTo(na.x,na.y); ctx.lineTo(nb.x,nb.y);
      ctx.strokeStyle='rgba(255,255,255,'+LINE_A+')';
      ctx.lineWidth=.75; ctx.stroke();
    }

    /* pulses */
    for(var i=0;i<pulses.length;i++){
      var p=pulses[i]; if(p.t<0) continue;
      var na=nodes[p.a],nb=nodes[p.b];
      var t=p.t,tA=Math.max(0,t-.22);
      var x0=na.x+(nb.x-na.x)*tA, y0=na.y+(nb.y-na.y)*tA;
      var x1=na.x+(nb.x-na.x)*t,  y1=na.y+(nb.y-na.y)*t;
      /* trail */
      var gr=ctx.createLinearGradient(x0,y0,x1,y1);
      gr.addColorStop(0,'rgba(180,210,255,0)');
      gr.addColorStop(1,'rgba(255,255,255,'+(p.al*.82).toFixed(2)+')');
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1);
      ctx.strokeStyle=gr; ctx.lineWidth=p.w*.58; ctx.stroke();
      /* head */
      ctx.save();
      ctx.shadowBlur=p.w*8; ctx.shadowColor='rgba(200,225,255,.95)';
      ctx.beginPath(); ctx.arc(x1,y1,p.w*.88,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+p.al.toFixed(2)+')'; ctx.fill();
      ctx.restore();
    }

    /* nodes */
    for(var i=0;i<nodes.length;i++){
      var n=nodes[i], pl=.5+.5*Math.sin(n.gph), hr=HALO_R*(1+pl*.58);
      /* halo */
      var g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,hr);
      g.addColorStop(0,'rgba(200,225,255,'+(0.13+pl*.2)+')');
      g.addColorStop(.42,'rgba(160,200,255,'+(0.04+pl*.07)+')');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(n.x,n.y,hr,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      /* ring */
      ctx.beginPath(); ctx.arc(n.x,n.y,NODE_R+5.5,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,'+(0.07+pl*.09)+')';
      ctx.lineWidth=1; ctx.stroke();
      /* core */
      ctx.save();
      ctx.shadowBlur=16*(1+pl); ctx.shadowColor='rgba(220,235,255,.85)';
      ctx.beginPath(); ctx.arc(n.x,n.y,NODE_R*(.78+pl*.36),0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+(0.67+pl*.33).toFixed(2)+')';
      ctx.fill(); ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(frame);

  /* fade out when React mounts */
  var obs=new MutationObserver(function(){
    var lc=document.getElementById('loading-container');
    if(!lc){obs.disconnect();return;}
    if(document.getElementById('root').children.length>1){
      lc.classList.add('fade-out');
      setTimeout(function(){lc.remove();obs.disconnect();},750);
    }
  });
  obs.observe(document.getElementById('root'),{childList:true});
})();
    </script>
  </body>
</html>
